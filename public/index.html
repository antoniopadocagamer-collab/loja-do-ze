<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Zé</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="pagina">
        <div class="card">
            <h1>Loja do Zé</h1>

            <section class="secao-form">
                <h2>Nova categoria</h2>
                <form id="form-categoria">
                    <input type="text" id="descricao" placeholder="Ex.: Brinquedos" required>
                    <button type="submit">Cadastrar</button>
                </form>
                <p id="mensagem"></p>
            </section>

            <section class="secao-lista">
                <h2>Categorias</h2>
                <ul id="lista-categorias"></ul>
            </section>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
